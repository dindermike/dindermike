<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python REPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@700;800&display=swap" rel="stylesheet">

<!-- Robots Meta Tag -->
<meta name="robots" content="index, follow">

<!-- Meta Description for SEO -->
<meta name="description" content="A personal AI Project by Mike Dinder. This shows Template 12">

<!-- Meta Keywords -->
<meta name="keywords" content="mike dinder, michael dinder, AI, Artificial Intelligence, Claude-AI, Claude Code, Generative AI">
<style>
  :root {
    --bg: #0c0e14;
    --surface: #11141c;
    --border: #1c2030;
    --accent: #00ffa3;
    --accent2: #7c5cfc;
    --error: #ff4d6d;
    --warn: #ff8c42;
    --text: #b8c4d8;
    --dim: #404860;
    --white: #edf0f7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    user-select: none;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--white);
    letter-spacing: -0.5px;
  }
  .logo em { color: var(--accent); font-style: normal; }

  .tagline {
    font-size: 0.68rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .status {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--dim);
  }

  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--dim);
    transition: background 0.3s, box-shadow 0.3s;
  }
  .dot.ready { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.busy  { background: var(--warn); box-shadow: 0 0 8px var(--warn); animation: blink 0.9s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  #loader {
    height: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    flex-shrink: 0;
  }
  #loader.active { animation: sweep 1.4s ease-in-out infinite; }
  @keyframes sweep {
    0%   { transform: scaleX(0); transform-origin: left; }
    50%  { transform: scaleX(1); transform-origin: left; }
    50.01% { transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #output {
    flex: 1;
    overflow-y: auto;
    padding: 18px 22px;
    font-size: 0.83rem;
    line-height: 1.75;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #output::-webkit-scrollbar { width: 4px; }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .line { display: block; white-space: pre-wrap; word-break: break-word; }
  .out  { color: var(--text); }
  .err  { color: var(--error); }
  .sys  { color: var(--dim); font-style: italic; }
  .echo { color: var(--accent2); }
  .inp  { color: var(--accent); }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 22px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .prompt-symbol { color: var(--accent2); font-size: 0.9rem; padding-bottom: 2px; }

  #code-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--white);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.83rem;
    caret-color: var(--accent);
    resize: none;
    line-height: 1.65;
    min-height: 22px;
    max-height: 180px;
    overflow-y: auto;
  }
  #code-input::placeholder { color: var(--dim); }

  .btn {
    border-radius: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.75rem;
    cursor: pointer;
    padding: 6px 14px;
    transition: opacity 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--accent); color: #000; border: none; font-weight: 500; letter-spacing: 0.4px; }
  .btn-ghost   { background: transparent; border: 1px solid var(--border); color: var(--dim); }
  .btn-ghost:hover { color: var(--text); border-color: var(--dim); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }

  #input-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(7, 9, 14, 0.78);
    backdrop-filter: blur(3px);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #input-overlay.show { display: flex; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--accent2);
    border-radius: 10px;
    padding: 26px 28px 22px;
    width: min(460px, 92vw);
    box-shadow: 0 0 0 1px rgba(124,92,252,0.12), 0 24px 60px rgba(0,0,0,0.6);
    animation: slideUp 0.16s ease-out;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

  .modal-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent2); margin-bottom: 10px; }
  .modal-prompt-text { font-size: 0.85rem; color: var(--accent); margin-bottom: 14px; white-space: pre-wrap; min-height: 1.3em; }

  #modal-input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 9px 12px;
    color: var(--white);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.83rem;
    outline: none;
    transition: border-color 0.15s;
  }
  #modal-input:focus { border-color: var(--accent2); }

  .modal-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
  .modal-hint { font-size: 0.69rem; color: var(--dim); }
</style>
</head>
<body>

<header>
  <div class="logo">PY<em>&gt;_</em>REPL</div>
  <div class="tagline">Client-side · WebAssembly</div>
  <div class="status">
    <div class="dot" id="dot"></div>
    <span id="status-text">Loading…</span>
  </div>
</header>

<div id="loader" class="active"></div>

<main>
  <div id="output"></div>
  <div class="input-row">
    <span class="prompt-symbol">&gt;&gt;&gt;</span>
    <textarea id="code-input" rows="1"
      placeholder="Type Python here — Enter to run, Shift+Enter for new line…"
      disabled></textarea>
    <button class="btn btn-ghost" onclick="clearOutput()">clear</button>
    <button class="btn btn-primary" id="run-btn" onclick="runCode()" disabled>Run ▶</button>
  </div>
</main>

<div id="input-overlay">
  <div class="modal">
    <div class="modal-label">input() called</div>
    <div class="modal-prompt-text" id="modal-prompt-text"></div>
    <input type="text" id="modal-input" autocomplete="off" spellcheck="false" placeholder="Type your value…">
    <div class="modal-footer">
      <span class="modal-hint">Press Enter or click Submit</span>
      <button class="btn btn-primary" onclick="submitInput()">Submit</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
<script>
  let pyodide = null;
  let history = [], histIdx = -1;
  let inputResolve = null;

  const outputEl     = document.getElementById('output');
  const codeInputEl  = document.getElementById('code-input');
  const runBtnEl     = document.getElementById('run-btn');
  const dotEl        = document.getElementById('dot');
  const statusEl     = document.getElementById('status-text');
  const loaderEl     = document.getElementById('loader');
  const overlayEl    = document.getElementById('input-overlay');
  const modalInputEl = document.getElementById('modal-input');
  const modalPromptEl= document.getElementById('modal-prompt-text');

  function print(text, cls = 'out') {
    const el = document.createElement('span');
    el.className = 'line ' + cls;
    el.textContent = text;
    outputEl.appendChild(el);
    outputEl.scrollTop = outputEl.scrollHeight;
  }

  function clearOutput() { outputEl.innerHTML = ''; }

  function setStatus(state) {
    const map = {
      loading: ['', 'Loading Pyodide…'],
      ready:   ['ready', 'Python 3 · ready'],
      busy:    ['busy', 'Running…'],
    };
    const [cls, txt] = map[state];
    dotEl.className = 'dot ' + cls;
    statusEl.textContent = txt;
  }

  function setInteractive(on) {
    runBtnEl.disabled   = !on;
    codeInputEl.disabled = !on;
    if (on) codeInputEl.focus();
  }

  // ── input() bridge ──────────────────────────────────────────
  // Called from Python; returns a JS Promise.
  // Pyodide's runPythonAsync / top-level await will suspend execution
  // until the Promise resolves (i.e., until the user submits the dialog).
  window._pyInputBridge = function(prompt) {
    return new Promise(resolve => {
      inputResolve = resolve;
      modalPromptEl.textContent = prompt || '';
      overlayEl.classList.add('show');
      modalInputEl.value = '';
      setTimeout(() => modalInputEl.focus(), 30);
    });
  };

  function submitInput() {
    if (!inputResolve) return;
    const val = modalInputEl.value;
    overlayEl.classList.remove('show');
    print((modalPromptEl.textContent || '') + val, 'inp');
    const cb = inputResolve;
    inputResolve = null;
    cb(val);
  }

  modalInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); submitInput(); }
  });

  // ── Init ───────────────────────────────────────────────────
  async function init() {
    pyodide = await loadPyodide();

    pyodide.setStdout({ batched: t => print(t, 'out') });
    pyodide.setStderr({ batched: t => print(t, 'err') });

    pyodide.globals.set('_js_input_bridge', window._pyInputBridge);

    // Patch builtins.input with an async coroutine.
    // runPythonAsync supports top-level await, so awaiting input() works
    // transparently inside user code (including inside for loops, functions, etc.)
    await pyodide.runPythonAsync(`
import builtins
import js

async def _async_input(prompt=''):
    val = await js._js_input_bridge(str(prompt) if prompt is not None else '')
    return val

builtins.input = _async_input
`);

    loaderEl.classList.remove('active');
    loaderEl.style.height = '0';
    setStatus('ready');
    setInteractive(true);

    print('# Python 3 · Pyodide · WebAssembly — running 100% in your browser', 'sys');
    print('# input() shows a dialog; your code pauses until you submit.', 'sys');
    print('# Shift+Enter = new line  |  ↑↓ = history', 'sys');
    print('', 'sys');
  }

  // ── Run ────────────────────────────────────────────────────
  async function runCode() {
    const raw = codeInputEl.value;
    if (!raw.trim() || !pyodide) return;

    history.unshift(raw);
    histIdx = -1;

    const lines = raw.split('\n');
    print('>>> ' + lines[0], 'echo');
    for (let i = 1; i < lines.length; i++) print('... ' + lines[i], 'echo');

    codeInputEl.value = '';
    autoResize();

    setStatus('busy');
    setInteractive(false);

    try {
      await pyodide.runPythonAsync(raw);
    } catch (err) {
      let msg = String(err);
      // Prefer the Python traceback portion
      const m = msg.match(/Traceback[\s\S]*/);
      print(m ? m[0] : msg, 'err');
    }

    setStatus('ready');
    setInteractive(true);
  }

  // ── Auto-resize textarea ────────────────────────────────────
  function autoResize() {
    codeInputEl.style.height = 'auto';
    codeInputEl.style.height = Math.min(codeInputEl.scrollHeight, 180) + 'px';
  }
  codeInputEl.addEventListener('input', autoResize);

  codeInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); runCode(); return; }
    if (e.key === 'ArrowUp' && codeInputEl.selectionStart === 0) {
      e.preventDefault();
      if (histIdx < history.length - 1) { histIdx++; codeInputEl.value = history[histIdx]; autoResize(); }
      return;
    }
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      histIdx > 0 ? (histIdx--, codeInputEl.value = history[histIdx]) : (histIdx = -1, codeInputEl.value = '');
      autoResize();
    }
  });

  setStatus('loading');
  init().catch(err => { print('Failed to load Pyodide: ' + err, 'err'); setStatus('ready'); });
</script>
</body>
</html>
